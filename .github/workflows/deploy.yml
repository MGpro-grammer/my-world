# Checks, builds and publishes the site on GitHub Pages at each push to main.
# The site is only published if every check passes. Pull requests (such as the
# dependency updates proposed by Dependabot) go through the same checks, but
# are never published.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the workflow be started by hand from the Actions tab.
  workflow_dispatch:

# Read-only by default; the deploy job alone gets the rights it needs.
permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run format:check
      - run: npm run lint
      # Every exported function, class, interface, type and constant must be documented.
      - run: npm run docs:check
      - run: npm test
      # Type check, browser build and prerendering of every page (see package.json).
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
